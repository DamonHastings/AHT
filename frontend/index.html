<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#b05a4a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fallback title only. Per-page title, description, Open Graph, Twitter, and
      canonical tags are managed by react-helmet-async (component:
      src/components/Seo.jsx, values from Sanity via resolveSeo) and baked into
      each route's HTML by the build prerender. We deliberately do NOT repeat the
      description / OG / Twitter meta here: the prerender captures helmet's
      versions, and static copies would produce duplicate description meta tags.
      Helmet manages the single title element below, so it does not duplicate.
    -->
    <title>Expressive Arts Therapy in Davis, CA | Arielle Rae Hastings, LMFT</title>

    <!-- Preconnect to font + Sanity image CDNs (LCP hero is a Sanity image) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Roboto:ital,wght@0,300;0,400;0,500;1,400&family=Roboto+Condensed:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
